<svg viewBox="20 20 1010 560" width="1010" height="560" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="포트폴리오 서비스 구조: 구현할 서버가 상품 조회와 포트폴리오 API를 제공하고, 30초마다 워커가 가상 시세 서버에서 시세를 받아온다">
<title>포트폴리오 서버 구조</title>
<desc>요청을 보내는 쪽 → 구현할 서버(상품 조회 API, 포트폴리오 API, DB, 시세 갱신 워커) → 가상 시세 서버. data/products.csv는 제공되는 수정 금지 파일이다.</desc>
<rect width="1050" height="600" fill="#ffffff"/>

<defs>
  <marker id="pf-arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
  </marker>
  <marker id="pf-arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
  </marker>
  <marker id="pf-arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/>
  </marker>
</defs>

<!-- 서버 컨테이너 -->
<rect x="260" y="40" width="430" height="440" rx="14" fill="#fbfbfc" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="475" y="65" text-anchor="middle" font-size="15" font-weight="700" fill="#334155" font-family="sans-serif">구현할 서버 (:8080)</text>

<!-- 요청자 -->
<rect x="30" y="120" width="180" height="130" rx="10" fill="#eef2ff" stroke="#818cf8" stroke-width="1.5"/>
<text text-anchor="middle" font-family="sans-serif" fill="#312e81">
  <tspan x="120" y="180" font-size="14" font-weight="700">요청을 보내는 쪽</tspan>
  <tspan x="120" y="202" font-size="12">(curl, HTTP Client)</tspan>
</text>

<!-- 상품 조회 API (파란색) -->
<rect x="290" y="90" width="190" height="60" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
<text x="385" y="125" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a" font-family="sans-serif">상품 조회 API</text>

<!-- 포트폴리오 API (파란색) -->
<rect x="290" y="180" width="190" height="60" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
<text x="385" y="215" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a" font-family="sans-serif">포트폴리오 API</text>

<!-- DB (H2) 실린더 -->
<path d="M340,335 A85,16 0 0 1 510,335 L510,395 A85,16 0 0 1 340,395 Z" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
<ellipse cx="425" cy="335" rx="85" ry="16" fill="#eef1f4" stroke="#64748b" stroke-width="1.5"/>
<text x="425" y="376" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b" font-family="sans-serif">DB (H2)</text>

<!-- 시세 갱신 워커 (주황색) -->
<rect x="290" y="440" width="190" height="55" rx="8" fill="#ffedd5" stroke="#f97316" stroke-width="1.5"/>
<text text-anchor="middle" font-family="sans-serif" fill="#7c2d12">
  <tspan x="385" y="463" font-size="14" font-weight="700">시세 갱신 워커</tspan>
  <tspan x="385" y="480" font-size="11">(30초마다, 토큰 관리)</tspan>
</text>

<!-- 제공 파일: products.csv (회색, 수정 금지) -->
<rect x="30" y="440" width="180" height="70" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
<text text-anchor="middle" font-family="sans-serif" fill="#334155">
  <tspan x="120" y="465" font-size="13" font-weight="700">data/products.csv</tspan>
  <tspan x="120" y="483" font-size="11">(제공 파일, 수정 금지)</tspan>
  <tspan x="120" y="499" font-size="10.5" fill="#b45309">중복 코드와 표기가 섞인 데이터</tspan>
</text>

<!-- 제공되는 가상 시세 서버 (회색) -->
<rect x="770" y="360" width="230" height="180" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
<text text-anchor="middle" font-family="sans-serif" fill="#334155">
  <tspan x="885" y="385" font-size="14" font-weight="700">제공되는 가상 시세 서버</tspan>
  <tspan x="885" y="402" font-size="11">(:9091)</tspan>
  <tspan x="885" y="426" font-size="11.5" font-family="ui-monospace, monospace">POST /auth/token</tspan>
  <tspan x="885" y="446" font-size="11.5" font-family="ui-monospace, monospace">GET /v1/prices</tspan>
  <tspan x="885" y="466" font-size="11.5" font-family="ui-monospace, monospace">GET /v1/fx</tspan>
  <tspan x="885" y="490" font-size="10.5" fill="#b45309">30초마다 변동, 가끔 503 응답</tspan>
  <tspan x="885" y="506" font-size="10.5" fill="#b45309">토큰은 120초 후 만료</tspan>
</text>

<!-- 화살표 -->
<line x1="210" y1="150" x2="288" y2="120" stroke="#2563eb" stroke-width="2" marker-end="url(#pf-arrow-blue)"/>
<text x="216" y="98" text-anchor="start" font-size="11" fill="#1d4ed8" font-family="sans-serif">GET /api/v1/products 등</text>

<line x1="210" y1="220" x2="288" y2="210" stroke="#2563eb" stroke-width="2" marker-end="url(#pf-arrow-blue)"/>
<text x="216" y="245" text-anchor="start" font-size="11" fill="#1d4ed8" font-family="sans-serif">POST/GET/PUT/DELETE</text>
<text x="216" y="259" text-anchor="start" font-size="11" fill="#1d4ed8" font-family="sans-serif">/api/v1/portfolios</text>

<line x1="385" y1="150" x2="410" y2="333" stroke="#64748b" stroke-width="1.5" marker-end="url(#pf-arrow-gray)"/>
<line x1="405" y1="240" x2="425" y2="333" stroke="#64748b" stroke-width="1.5" marker-end="url(#pf-arrow-gray)"/>
<text x="440" y="290" font-size="11" fill="#334155" font-family="sans-serif">조회, 저장</text>

<line x1="120" y1="440" x2="120" y2="300" stroke="#64748b" stroke-width="1.5"/>
<line x1="120" y1="300" x2="340" y2="300" stroke="#64748b" stroke-width="1.5" marker-end="url(#pf-arrow-gray)"/>
<text x="130" y="292" font-size="11" fill="#334155" font-family="sans-serif">서버 시작 시 읽어서 정리 후 저장</text>

<line x1="480" y1="460" x2="768" y2="440" stroke="#ea580c" stroke-width="2" marker-end="url(#pf-arrow-orange)"/>
<text text-anchor="middle" font-family="sans-serif" fill="#c2410c">
  <tspan x="625" y="430" font-size="12" font-weight="700">토큰 발급, 시세와 환율 조회</tspan>
</text>

<line x1="480" y1="450" x2="508" y2="368" stroke="#64748b" stroke-width="1.5" marker-end="url(#pf-arrow-gray)"/>
<text x="530" y="405" font-size="11" fill="#334155" font-family="sans-serif">최근 시세 저장</text>

<!-- 범례 -->
<rect x="30" y="530" width="14" height="14" fill="#dbeafe" stroke="#3b82f6"/>
<text x="50" y="541" font-size="12" fill="#334155" font-family="sans-serif">접수 경로: 요청이 오면 DB를 조회해 바로 응답</text>
<rect x="30" y="555" width="14" height="14" fill="#ffedd5" stroke="#f97316"/>
<text x="50" y="566" font-size="12" fill="#334155" font-family="sans-serif">워커 경로: 주기적으로 외부 서버와 통신</text>
<rect x="330" y="530" width="14" height="14" fill="#f1f5f9" stroke="#64748b"/>
<text x="350" y="541" font-size="12" fill="#334155" font-family="sans-serif">제공되는 부분 (파일, 외부 서버)</text>
</svg>
