server:
  port: 8080

spring:
  application:
    name: portfolio-return-service
  datasource:
    url: jdbc:h2:mem:portfolio;DB_CLOSE_DELAY=-1
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

